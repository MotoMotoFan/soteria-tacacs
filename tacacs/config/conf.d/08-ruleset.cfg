# =============================================================================
# 08-ruleset.cfg - Authorization ruleset
# =============================================================================
# Company:    Pathfinder Insights
# Engineer:   MotoMotoFan
# Project:    Soteria AAA Infrastructure
# =============================================================================
# Maps LDAP group membership (returned by MAVIS) to authorization profiles.
# Rules are evaluated top-down - first match wins.
# =============================================================================

ruleset {
    rule {
        enabled = yes
        script {
            # Full admin access
            if (member == tacacs_admin) {
                profile = tacacs_admin
                permit
            }
            # Read-only access
            if (member == tacacs_readonly) {
                profile = tacacs_readonly
                permit
            }
            deny
        }
    }
}
