# =============================================================================
# 01-logging.cfg - Log destinations and assignments
# =============================================================================
# Company:    Pathfinder Insights
# Engineer:   MotoMotoFan
# Project:    Soteria AAA Infrastructure
# =============================================================================

# -----------------------------------------------------------------------------
# Suppress non-session logs from appearing in terminal/syslogd
# -----------------------------------------------------------------------------
syslog default = deny

# -----------------------------------------------------------------------------
# Authentication log - per day, RFC5424 format
# -----------------------------------------------------------------------------
log authentication_log {
    destination = /var/log/tac_plus/authentication/%Y/%m/authentication-%m-%d-%Y.log
    timestamp   = RFC5424
}

# -----------------------------------------------------------------------------
# Authorization log - per day, RFC5424 format
# -----------------------------------------------------------------------------
log authorization_log {
    destination = /var/log/tac_plus/authorization/%Y/%m/authorization-%m-%d-%Y.log
    timestamp   = RFC5424
}

# -----------------------------------------------------------------------------
# Accounting log - per day, RFC5424 format
# -----------------------------------------------------------------------------
log accounting_log {
    destination = /var/log/tac_plus/accounting/%Y/%m/accounting-%m-%d-%Y.log
    timestamp   = RFC5424
}

# -----------------------------------------------------------------------------
# Log assignments
# -----------------------------------------------------------------------------
authentication log = authentication_log
authorization log  = authorization_log
accounting log     = accounting_log

# -----------------------------------------------------------------------------
# Future external syslog export - uncomment and set your collector IP/port
# -----------------------------------------------------------------------------
# log external_syslog {
#     destination = 0.0.0.0:514
#     timestamp   = RFC5424
# }
# authentication log = external_syslog
# authorization log  = external_syslog
# accounting log     = external_syslog
