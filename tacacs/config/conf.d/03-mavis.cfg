# Project:    Soteria AAA Infrastructure
# =============================================================================

# Authorization cache for performance improvement
mavis module = tacinfo_cache {
    directory = /tmp/tacinfo
}

mavis module = external {
    # LDAP server type: "generic" (OpenLDAP) or "microsoft" (Active Directory)
    setenv LDAP_SERVER_TYPE = "${LDAP_SERVER_TYPE}"

    # LDAP connection - supports space-separated list for failover
    setenv LDAP_HOSTS       = "${LDAP_HOSTS}"

    # LDAP bind credentials
    setenv LDAP_USER        = "${LDAP_USER}"
    setenv LDAP_PASSWD      = "${LDAP_PASSWD}"

    # User search parameters
    setenv LDAP_BASE        = "${LDAP_BASE}"
    setenv LDAP_SCOPE       = "${LDAP_SCOPE}"
    setenv LDAP_FILTER      = "${LDAP_FILTER}"

    # Group search parameters
    setenv LDAP_BASE_GROUP   = "${LDAP_BASE_GROUP}"
    setenv LDAP_SCOPE_GROUP  = "${LDAP_SCOPE_GROUP}"
    setenv LDAP_FILTER_GROUP = "${LDAP_FILTER_GROUP}"

    # General LDAP parameters
    setenv LDAP_CONNECT_TIMEOUT = "${LDAP_CONNECT_TIMEOUT}"
    setenv LDAP_TACMEMBER       = "${LDAP_TACMEMBER}"

    exec = /usr/local/lib/mavis/mavis_tacplus-ng_ldap.pl
}

# Authentication backends
login backend = mavis
user backend  = mavis
pap backend   = mavis

# Cache settings (24h)
cache timeout       = 86400
mavis cache timeout = 86400
