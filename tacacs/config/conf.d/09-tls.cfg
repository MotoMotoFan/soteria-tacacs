# =============================================================================
# 09-tls.cfg - TLS configuration for TACACS+ over TLS (RFC draft)
# =============================================================================
# Company:    Pathfinder Insights
# Engineer:   MotoMotoFan
# Project:    Soteria AAA Infrastructure
# =============================================================================
# Enables encrypted TACACS+ sessions on port 300 (IANA assigned).
# Requires TLS certificate, key, and CA files mounted into the container.
#
# To disable TLS: remove the TLS listen directive from tac_plus-ng.cfg
# and don't mount certificates.
#
# Certificate generation example (self-signed for testing):
#   openssl req -x509 -newkey rsa:4096 -keyout server.key -out server.crt \
#     -sha256 -days 365 -nodes -subj "/CN=soteria-tacacs"
#   cp your-ca.crt ca.crt
# =============================================================================

# TLS certificate paths (mounted via Docker volume)
tls cert-file = /etc/tac_plus-ng/tls/server.crt
tls key-file  = /etc/tac_plus-ng/tls/server.key
tls ca-file   = /etc/tac_plus-ng/tls/ca.crt

# Require full certificate chain validation from devices
tls.peer.cert.validation = cert
