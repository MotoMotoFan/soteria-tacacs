# =============================================================================
# 05-local-users.cfg - Local fallback and service account users
# =============================================================================
# Company:    Pathfinder Insights
# Engineer:   MotoMotoFan
# Project:    Soteria AAA Infrastructure
# =============================================================================
# Passwords stored as SHA-512 crypt hashes, injected from the environment at
# first deploy (see .env.example: LOCAL_ADMIN_PW_HASH / LOCAL_READONLY_PW_HASH).
# Generate a hash with:  openssl passwd -6 'yourpassword'
# install.sh will prompt for these and write the hashes to .env for you.
# No real credential is committed to the repository.
# =============================================================================

# Full admin access
user network_admin {
    password login = crypt "${LOCAL_ADMIN_PW_HASH}"
    password pap   = login
    member         = tacacs_admin
}

# Read-only access
user network_readonly {
    password login = crypt "${LOCAL_READONLY_PW_HASH}"
    password pap   = login
    member         = tacacs_readonly
}
