# =============================================================================
# logrotate.conf - Process log rotation for tac_plus-ng.log
# =============================================================================
# Company:    Pathfinder Insights
# Engineer:   MotoMotoFan
# Project:    Soteria AAA Infrastructure
# =============================================================================
# This handles rotation of the tac_plus-ng process log only.
# AAA logs (authentication/authorization/accounting) are handled by
# the monthly-archive.sh script via cron.
# =============================================================================

/var/log/tac_plus/tac_plus-ng.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 640 root root
}
