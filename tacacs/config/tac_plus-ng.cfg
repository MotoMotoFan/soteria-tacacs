#!/usr/local/sbin/tac_plus-ng
# =============================================================================
# Soteria TACACS+ Server - Main Configuration
# =============================================================================
# Company:    Pathfinder Insights
# Engineer:   MotoMotoFan
# Project:    Soteria AAA Infrastructure
# =============================================================================
# spawnd is built into the tac_plus-ng binary - no separate process needed.
# This block configures the built-in connection broker.
# =============================================================================

id = spawnd {
    background = no

    listen = {
        address = 0.0.0.0
        port = 49
    }

    # TLS-encrypted TACACS+ listener (IANA port 300)
    # Only active when ENABLE_TLS=true and certificates are mounted
    # listen = {
    #     address = 0.0.0.0
    #     port = 300
    #     tls = yes
    # }

    spawn = {
        instances min = 1
        instances max = 20
    }
}

id = tac_plus-ng {

    # ---------------------------------------------------------------------------
    # Explicit includes - order is significant, do not reorder
    # ---------------------------------------------------------------------------
    include = /etc/tac_plus-ng/conf.d/01-logging.cfg
    include = /etc/tac_plus-ng/conf.d/02-dns.cfg
    # include = /etc/tac_plus-ng/conf.d/03-mavis.cfg
    include = /etc/tac_plus-ng/conf.d/04-devices.cfg
    include = /etc/tac_plus-ng/conf.d/06-groups.cfg
    include = /etc/tac_plus-ng/conf.d/07-profiles.cfg
    include = /etc/tac_plus-ng/conf.d/08-ruleset.cfg
    include = /etc/tac_plus-ng/conf.d/05-local-users.cfg
    # include = /etc/tac_plus-ng/conf.d/09-tls.cfg

}
