# -----------------------------------------------------------------------------
# Admin profile - Privilege level 15, all commands permitted
# -----------------------------------------------------------------------------
profile tacacs_admin {
    script {
        if (service == shell) {
            if (cmd == "") {
                set priv-lvl = 15
                permit
            }
            permit
        }
        deny
    }
}

# -----------------------------------------------------------------------------
# Read-only profile - Privilege level 3, all commands permitted
# -----------------------------------------------------------------------------
profile tacacs_readonly {
    script {
        if (service == shell) {
            if (cmd == "") {
                set priv-lvl = 3
                permit
            }
            permit
        }
        deny
    }
}
