# Full admin access
user network_admin {
    password login = crypt "$6$exadmin01$2Tbd6UFE3uzSSvtMSmUcDYnNNy.Mf6wyGcgn4flTOajlRna12qTCBKPv9Q7BeGp/fhDRGlg/gyOv69nxlrg5x0"
    password pap   = login
    member         = tacacs_admin
}

# Read-only access
user network_readonly {
    password login = crypt "$6$exread01$4dVqQfba1spNeR.TbG0PnNNDFX6p4AiYRDQqxtCNiMs1H0Kab/61PhQxoyZ2lL6I./U41JyZQq61TveVkaTDU0"
    password pap   = login
    member         = tacacs_readonly
}
